name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ShellCheck
        run: shellcheck kbd.sh kbd-theme-hook.sh

      - name: Manifest
        run: |
          jq -e '.schemaVersion == 1
                 and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
                 and (.kinds | length > 0)
                 and .entryPoints.barWidget != null
                 and .barWidget.displayName != null' manifest.json
          test -f "$(jq -r .entryPoints.barWidget manifest.json)"

      - name: Required files
        run: test -f LICENSE && test -f Panel.qml && grep -qiE '^#+ *install' README.md && grep -qiE '^#+ *remove' README.md

      - name: No symlinks
        run: test -z "$(find . -path ./.git -prune -o -type l -print)"
